# Segunda red de seguridad: en cada cambio, GitHub corre las mismas pruebas
# y deja una marca verde o roja al lado del cambio.
name: Pruebas
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
